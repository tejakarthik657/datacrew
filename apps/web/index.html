<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataCrew</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202b;--mute:#667085;--line:#e3e7ec;--brand:#2b5fd9;--red:#c0392b;--amber:#b7791f;--green:#2f855a}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e8edf2;--mute:#93a1b1;--line:#2a3542;--brand:#6c9bff}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}header .sp{flex:1}.pill{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--mute)}
main{display:grid;grid-template-columns:240px 1fr;gap:14px;padding:14px;max-width:1400px;margin:0 auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
button{font:inherit;background:var(--brand);color:#fff;border:0;border-radius:7px;padding:7px 12px;cursor:pointer}button.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:wait}
input,select,textarea{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px}input[type=text],input[type=email],input[type=password]{width:100%}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:600;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:transparent;color:var(--ink);border:1px solid var(--line)}.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ds{padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}.ds:hover{background:var(--bg)}.ds.on{border-color:var(--brand)}
.badge{font-size:11px;border-radius:5px;padding:1px 6px;color:#fff}.low,.green{background:var(--green)}.medium,.amber{background:var(--amber)}.high,.red{background:var(--red)}
.gauges{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.g{text-align:center}.g .n{font-size:40px;font-weight:700}.arrow{font-size:30px;color:var(--mute)}
pre{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:8px;overflow:auto;max-height:340px;font-size:12px}.mute{color:var(--mute)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.scroll{overflow:auto;max-height:420px}.del{background:#c0392b22}.chg b{color:var(--brand)}.err{color:var(--red)}
</style></head><body>
<header><h1>DataCrew</h1><span class="pill" id="mode"></span><span class="sp"></span><span id="who" class="mute"></span><button class="ghost" id="logout" style="display:none">Log out</button></header>
<div id="app"></div>
<script>
const S={rid:0,token:sessionStorage.getItem('dc_token')||'',list:[],ds:null,plan:null,tab:'plan',busy:false};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){
  const h={...(opts.headers||{})};if(S.token)h.Authorization='Bearer '+S.token;
  let body=opts.body;if(body&&!(body instanceof FormData)){h['Content-Type']='application/json';body=JSON.stringify(body)}
  const r=await fetch(path,{method:opts.method||'GET',headers:h,body});
  if(opts.raw)return r;
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.message||r.statusText);e.hint=j.hint;e.code=j.code;throw e}
  return j}
function toast(m,bad){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:16px;right:16px;padding:10px 14px;border-radius:8px;color:#fff;z-index:9;background:'+(bad?'#c0392b':'#2b5fd9');document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
async function guard(fn){try{S.busy=true;return await fn()}catch(e){toast(e.message+(e.hint?' — '+e.hint:''),true)}finally{S.busy=false}}
async function poll(id,onp){for(;;){const j=await api('/jobs/'+id);if(onp)onp(j);if(j.status==='done')return j;if(j.status==='failed')throw new Error((j.error&&j.error.message)||'job failed');await new Promise(r=>setTimeout(r,400))}}
function download(path,name){return guard(async()=>{const r=await api(path,{raw:true});if(!r.ok)throw new Error('download failed');const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()})}

// ---------- auth
function authView(){
  $('#app').innerHTML=`<div class="card" style="max-width:380px;margin:60px auto"><h2>Welcome to DataCrew</h2><p class="mute">Messy data in, trusted data out. Runs locally with no API keys.</p>
  <p><input type="email" id="em" placeholder="email"></p><p><input type="password" id="pw" placeholder="password (8+ chars)"></p>
  <div class="row"><button id="li">Log in</button><button class="ghost" id="rg">Create account</button></div></div>`;
  const go=p=>guard(async()=>{const j=await api(p,{method:'POST',body:{email:$('#em').value,password:$('#pw').value}});S.token=j.token;sessionStorage.setItem('dc_token',j.token);boot()});
  $('#li').onclick=()=>go('/auth/login');$('#rg').onclick=()=>go('/auth/register')}
$('#logout').onclick=()=>{sessionStorage.removeItem('dc_token');S.token='';boot()};

// ---------- shell
async function boot(){
  const h=await api('/health');$('#mode').textContent='mode: '+h.mode+' · llm: '+h.llm;
  if(!S.token){$('#who').textContent='';$('#logout').style.display='none';return authView()}
  try{const me=await api('/auth/me');$('#who').textContent=me.email+' ('+me.role+')';$('#logout').style.display=''}catch(e){S.token='';return authView()}
  $('#app').innerHTML=`<main><aside><div class="card"><div class="row"><button id="up">Upload file</button><input type="file" id="file" hidden accept=".csv,.xlsx,.json,.parquet,.tsv"></div>
  <p><button class="ghost" id="demo">Load demo (dirty customers)</button></p><p><button class="ghost" id="url">Import table from a web page</button></p><div id="dsl"></div></div></aside><section id="main"></section></main>`;
  $('#up').onclick=()=>$('#file').click();
  $('#file').onchange=e=>upload(e.target.files[0]);
  $('#url').onclick=()=>{const u=prompt('Public page URL containing an HTML table (robots.txt is respected):');if(u)guard(async()=>{const d=await api('/datasets/from-url',{method:'POST',body:{url:u}});toast('Imported '+d.rows+' rows; health score '+d.score);await refreshList();open(d.id)})};
  $('#demo').onclick=()=>guard(async()=>{const r=await fetch('/demo/dirty_customers.csv');if(!r.ok)throw new Error('demo file missing: run make demo-data');upload(new File([await r.blob()],'dirty_customers.csv'))});
  await refreshList();if(S.list.length)open(S.list[0].id);else $('#main').innerHTML='<div class="card"><h3>Start here</h3><p>Upload a CSV/XLSX/JSON file, or load the demo dataset. You will see the health score, an AI cleaning plan with a toggle per step, and a before/after diff.</p></div>'}
async function refreshList(){S.list=await api('/datasets');$('#dsl').innerHTML=S.list.map(d=>`<div class="ds ${S.ds&&S.ds.id===d.id?'on':''}" data-id="${esc(d.id)}"><b>${esc(d.name)}</b><div class="mute">score ${d.score} · ${d.rows} rows · v${d.current_version}</div></div>`).join('');
  document.querySelectorAll('.ds').forEach(e=>e.onclick=()=>open(e.dataset.id))}
function upload(f){if(!f)return;guard(async()=>{const fd=new FormData();fd.append('file',f);const d=await api('/datasets',{method:'POST',body:fd});toast('Uploaded: health score '+d.score);await refreshList();open(d.id)})}
async function open(id){await guard(async()=>{S.ds=await api('/datasets/'+id);S.plan=null;await refreshList();render()})}
function render(){const d=S.ds;if(!d)return;S.rid++;const tabs=[['plan','Clean'],['risks','Risks & rules'],['ask','Ask'],['forecast','Forecast'],['strategy','Strategy'],['crew','Crew'],['trust','Trust & privacy'],['data','Data']];
  $('#main').innerHTML=`<div class="card"><h2 style="margin:0">${esc(d.name)}</h2><div class="mute">${d.rows} rows · ${d.columns.length} columns · version v${d.current_version} · health ${d.score}</div></div>
  <div class="tabs">${tabs.map(([k,l])=>`<button data-t="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')}</div><div id="pane"></div>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
  ({plan:planView,risks:risksView,ask:askView,forecast:forecastView,strategy:strategyView,crew:crewView,trust:trustView,data:dataView})[S.tab]()}

// ---------- clean
function gauge(label,n){return `<div class="g"><div class="n">${n==null?'–':Math.round(n)}</div><div class="mute">${label}</div></div>`}
function planView(){const d=S.ds,p=S.plan;const v0=d.versions[0].score;
  let h=`<div class="card"><div class="gauges">${gauge('before',v0)}<span class="arrow">→</span>${gauge('now (v'+d.current_version+')',d.score)}<div style="flex:1"></div><button id="gen">${p?'Regenerate plan':'Generate AI plan'}</button></div>
  <p class="mute">The plan is proposed from the data profile; nothing changes until you approve and apply. Scores are deterministic (no LLM).</p></div>`;
  if(p){h+=`<div class="card"><div class="row"><b>Cleaning plan</b><span class="pill">${esc(p.source)}</span><span class="pill">${esc(p.dataset_type)}</span><span class="mute">${esc(p.notes)}</span></div>
  <div class="scroll"><table><tr><th>Apply</th><th>Step</th><th>Columns</th><th>Why</th><th>Rows</th><th>Risk</th><th>Conf.</th><th></th></tr>
  ${p.steps.map(s=>`<tr><td><input type="checkbox" data-s="${s.id}" ${s.approved?'checked':''}></td><td><b>${esc(s.type)}</b><div class="mute">${s.id}</div></td><td>${esc(s.columns.slice(0,4).join(', '))}${s.columns.length>4?'…':''}</td><td>${esc(s.rationale)}</td><td>${s.affected_rows_estimate}</td><td><span class="badge ${s.risk_level}">${s.risk_level}</span></td><td>${Math.round(s.confidence*100)}%</td><td><button class="ghost" data-pv="${s.id}">preview</button></td></tr><tr id="pv-${s.id}" hidden><td colspan="8"></td></tr>`).join('')}</table></div>
  <div class="row" style="margin-top:10px"><button id="exe">Apply approved steps</button><span id="prog" class="mute"></span></div></div>`}
  h+=`<div id="after"></div>`;$('#pane').innerHTML=h;
  $('#gen').onclick=()=>guard(async()=>{$('#gen').disabled=true;const j=await api('/datasets/'+d.id+'/plan',{method:'POST'});const r=await poll(j.job_id);S.plan=await api('/plans/'+r.plan_id);planView()});
  if(!p)return;
  document.querySelectorAll('[data-s]').forEach(c=>c.onchange=()=>guard(async()=>{S.plan=await api(`/plans/${p.id}/steps/${c.dataset.s}`,{method:'PATCH',body:{approved:c.checked}})}));
  document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>guard(async()=>{const r=await api(`/plans/${p.id}/steps/${b.dataset.pv}/preview`);const row=$('#pv-'+b.dataset.pv);row.hidden=!row.hidden;
    row.firstChild.innerHTML=diffHtml(r.diff,`${r.info.affected_rows} rows affected`)}));
  $('#exe').onclick=()=>guard(async()=>{$('#exe').disabled=true;const j=await api(`/plans/${p.id}/execute`,{method:'POST'});
    await poll(j.job_id,x=>$('#prog').innerHTML=`<span class="bar" style="display:inline-block;width:160px"><i style="width:${Math.round(x.progress*100)}%"></i></span> ${Math.round(x.progress*100)}%`);
    S.ds=await api('/datasets/'+d.id);S.plan=await api('/plans/'+p.id);await refreshList();toast(`Score ${S.plan.score_before} → ${S.plan.score_after}`);planView()});
  if(p.status==='executed')afterView()}
function diffHtml(df,title){const ch=df.changed.slice(0,12).map(c=>`<tr><td>#${c.row_id}</td><td class="chg">${Object.entries(c.cells).map(([k,v])=>`${esc(k)}: ${esc(v[0]??'∅')} → <b>${esc(v[1]??'∅')}</b>`).join('<br>')}</td></tr>`).join('');
  const rm=df.removed.slice(0,6).map(r=>`<tr class="del"><td>#${r.row_id}</td><td>removed: ${esc(Object.values(r.row).slice(0,4).join(' | '))}</td></tr>`).join('');
  return `<div class="mute">${esc(title||'')} · ${df.total_changed} changed rows, ${df.total_removed} removed${df.added_columns.length?', new cols: '+esc(df.added_columns.join(', ')):''}</div><table>${ch}${rm}</table>`}
async function afterView(){const d=S.ds,p=S.plan,rid=S.rid;if(!p||p.status!=='executed')return;const df=await api(`/datasets/${d.id}/diff?limit=12`);if(rid!==S.rid||!$('#after'))return;
  $('#after').innerHTML=`<div class="card"><h3 style="margin-top:0">Result</h3><div class="gauges">${gauge('before',p.score_before)}<span class="arrow">→</span>${gauge('after',p.score_after)}</div>
  <h4>Diff (original → current)</h4><div class="scroll">${diffHtml(df,'')}</div>
  <h4>Versions &amp; undo</h4><div class="row">${d.versions.map(v=>`<button class="ghost" data-rv="${v.number}">${v.number===d.current_version?'● ':''}v${v.number}: ${v.score}</button>`).join('')}<button id="undo">Undo last step</button></div>
  <p class="mute">Per-step undo: untick a step above and apply again — the engine always re-runs from the original.</p>
  <h4>Download &amp; recipe</h4><div class="row"><button class="ghost" data-dl="csv">CSV</button><button class="ghost" data-dl="xlsx">XLSX</button><button class="ghost" data-dl="parquet">Parquet</button>
  <button class="ghost" data-rc="python">Python recipe</button><button class="ghost" data-rc="sql">SQL recipe</button><button class="ghost" data-rc="json">JSON recipe</button></div><pre id="rcv" hidden></pre></div>`;
  document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>guard(async()=>{await api(`/datasets/${d.id}/versions/${b.dataset.rv}/restore`,{method:'POST'});S.ds=await api('/datasets/'+d.id);await refreshList();planView()}));
  $('#undo').onclick=()=>guard(async()=>{await api(`/datasets/${d.id}/undo`,{method:'POST'});S.ds=await api('/datasets/'+d.id);await refreshList();planView()});
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>download(`/datasets/${d.id}/export?fmt=${b.dataset.dl}`,`clean.${b.dataset.dl}`));
  document.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>guard(async()=>{const r=await api(`/plans/${p.id}/recipe?fmt=${b.dataset.rc}`,{raw:true});const t=await r.text();const pre=$('#rcv');pre.hidden=false;pre.textContent=t.length>14000?t.slice(0,14000)+'\n… (download via API for the full file)':t}))}

// ---------- risks
async function risksView(){const d=S.ds,rid=S.rid;$('#pane').innerHTML='<div class="card">Loading…</div>';const [now,orig]=await Promise.all([api(`/datasets/${d.id}/risks`),api(`/datasets/${d.id}/risks?version=0`)]);if(rid!==S.rid)return;
  const tbl=(r)=>`<table><tr><th>Risk</th><th>Column</th><th>Severity</th><th>Count</th><th>Detail</th></tr>${r.map(x=>`<tr><td>${esc(x.kind)}</td><td>${esc(x.column||'—')}</td><td><span class="badge ${x.severity}">${x.severity}</span></td><td>${x.count}</td><td>${esc(x.detail)}</td></tr>`).join('')}</table>`;
  $('#pane').innerHTML=`<div class="card"><h3 style="margin-top:0">Risk grid (current version): ${now.risks.length} open · ${orig.risks.length} in the original</h3><div class="scroll">${tbl(now.risks)}</div></div>
  <div class="card"><h3 style="margin-top:0">Plain-English rules</h3><div class="row"><input type="text" id="rt" placeholder="e.g. phone must be 10 digits · salary between 20000 and 90000" style="flex:1"><button id="ra">Add rule</button></div><div id="rr"></div>
  <ul>${d.rules.map(r=>`<li>${esc(r.text)}</li>`).join('')}</ul></div>`;
  $('#ra').onclick=()=>guard(async()=>{const r=await api(`/datasets/${d.id}/rules`,{method:'POST',body:{text:$('#rt').value}});$('#rr').innerHTML=`<p>Rule understood (${esc(r.rule.kind)} on ${esc(r.rule.column)}): <b>${r.violations}</b> violating rows.</p>`;S.ds=await api('/datasets/'+d.id)})}

// ---------- ask
function barChart(c){const max=Math.max(...c.data.map(x=>x.y))||1;return `<svg viewBox="0 0 520 ${c.data.length*24+10}" width="100%">${c.data.map((x,i)=>`<text x="0" y="${i*24+16}" font-size="12" fill="currentColor">${esc(x.x)}</text><rect x="130" y="${i*24+4}" width="${Math.max(2,x.y/max*330)}" height="16" fill="#2b5fd9"/><text x="${135+x.y/max*330}" y="${i*24+16}" font-size="11" fill="currentColor">${Math.round(x.y*100)/100}</text>`).join('')}</svg>`}
function askView(){const d=S.ds;$('#pane').innerHTML=`<div class="card"><div class="row"><input type="text" id="q" style="flex:1" placeholder="e.g. average amount_inr by city · how many rows have status overdue · top 5 by amount_inr"><button id="go">Ask</button></div><div id="ans"></div></div>`;
  $('#go').onclick=()=>guard(async()=>{const r=await api(`/datasets/${d.id}/chat`,{method:'POST',body:{question:$('#q').value}});
    $('#ans').innerHTML=`<h3>${esc(r.answer)}</h3><div class="mute">${esc(r.explanation)} · planner: ${esc(r.planner)}</div>${r.chart_spec?barChart(r.chart_spec):''}<h4>SQL (read-only, guarded)</h4><pre>${esc(r.sql)}</pre><div class="scroll"><table><tr>${r.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${r.rows.slice(0,25).map(x=>`<tr>${x.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div>
    <p class="mute">Source rows (ids): ${esc(r.source_row_keys.slice(0,30).join(', '))}${r.source_row_keys.length>30?'…':''}</p>`})}

// ---------- forecast
function forecastView(){const d=S.ds;$('#pane').innerHTML=`<div class="card"><div class="row"><label>Months ahead <input type="number" id="h" value="3" min="1" max="12" style="width:70px"></label><button id="go">Forecast</button></div><div id="fo"></div><p class="mute">Statistical model (not an LLM). Ranges are 80% intervals; log forecasts and score them against actuals via the API.</p></div>`;
  $('#go').onclick=()=>guard(async()=>{const f=await api(`/datasets/${d.id}/forecast`,{method:'POST',body:{horizon:+$('#h').value}});
    $('#fo').innerHTML=`<h3>${esc(f.metric)} — model ${esc(f.model)}</h3>${lineChart(f)}<table><tr><th>Month</th><th>Estimate</th><th>Low</th><th>High</th></tr>${f.points.map(p=>`<tr><td>${p.ts}</td><td>${p.yhat.toLocaleString()}</td><td>${p.lower.toLocaleString()}</td><td>${p.upper.toLocaleString()}</td></tr>`).join('')}</table>`})}
function lineChart(f){const H=f.history,P=f.points,all=[...H.map(x=>x.value),...P.map(x=>x.upper),...P.map(x=>x.lower)],mx=Math.max(...all),mn=Math.min(...all,0),n=H.length+P.length,X=i=>20+i*(560/(n-1)),Y=v=>170-(v-mn)/(mx-mn||1)*150;
  const hp=H.map((x,i)=>`${X(i)},${Y(x.value)}`).join(' '),fp=[H[H.length-1].value,...P.map(p=>p.yhat)].map((v,i)=>`${X(H.length-1+i)},${Y(v)}`).join(' ');
  const band=P.map((p,i)=>`${X(H.length+i)},${Y(p.upper)}`).join(' ')+' '+[...P].reverse().map((p,i)=>`${X(H.length+P.length-1-i)},${Y(p.lower)}`).join(' ');
  return `<svg viewBox="0 0 600 190" width="100%"><polygon points="${band}" fill="#2b5fd933"/><polyline points="${hp}" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="${fp}" fill="none" stroke="#2b5fd9" stroke-width="2" stroke-dasharray="5 4"/></svg>`}

// ---------- strategy
async function strategyView(){const d=S.ds,rid=S.rid;$('#pane').innerHTML='<div class="card">Loading…</div>';const s=await api(`/datasets/${d.id}/strategy`);if(rid!==S.rid)return;drawStrategy(s)}
function drawStrategy(s){const d=S.ds;$('#pane').innerHTML=`<div class="card"><h3 style="margin-top:0">What will add value</h3>${s.opportunities.map(o=>`<div class="card"><b>#${o.rank} ${esc(o.title)}</b><div>₹${Math.round(o.value_at_stake_inr_per_month).toLocaleString('en-IN')} / month at stake · confidence ${esc(o.confidence)}</div><div class="mute">Next: ${esc(o.next_step)} · evidence rows: ${esc(o.evidence_row_keys.slice(0,8).join(', ')||'—')}</div>
  <div class="row" style="margin-top:6px">${Object.entries(o.assumptions).map(([k,v])=>`<label>${esc(k)} <input type="number" step="any" style="width:130px" data-o="${esc(o.id)}" data-k="${esc(k)}" value="${v}"></label>`).join('')}</div></div>`).join('')||'<p>No opportunities detected for this dataset shape.</p>'}
  <button id="sim">Recalculate with my assumptions</button><p class="mute">Values are computed from your data and these editable assumptions, never generated by an LLM.</p></div><div class="card"><h3 style="margin-top:0">CEO brief</h3><pre>${esc(s.ceo_brief_markdown)}</pre></div>`;
  $('#sim').onclick=()=>guard(async()=>{const a={};document.querySelectorAll('[data-o]').forEach(i=>{(a[i.dataset.o]=a[i.dataset.o]||{})[i.dataset.k]=parseFloat(i.value)});drawStrategy(await api(`/datasets/${d.id}/strategy/simulate`,{method:'POST',body:{assumptions:a}}))})}

// ---------- crew
function crewView(){const d=S.ds;$('#pane').innerHTML=`<div class="card"><p>The crew runs <b>Supervisor → Cleaner → Analyst → Forecaster → Strategist</b>. It pauses for your approval before anything is written.</p><div class="row"><input type="text" id="cq" style="flex:1" placeholder="optional question for the Analyst"><button id="cr">Start crew run</button></div></div><div id="run"></div>`;
  $('#cr').onclick=()=>guard(async()=>drawRun(await api('/crew/run',{method:'POST',body:{dataset_id:d.id,question:$('#cq').value||null}})))}
function drawRun(r){$('#run').innerHTML=`<div class="card"><h3 style="margin-top:0">Agent replay <span class="pill">${esc(r.status)}</span></h3>${r.events.map(e=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(e.agent)}</b> · ${esc(e.action)} <span class="mute">${e.duration_ms} ms</span><div>${esc(e.summary)}</div></div>`).join('')}
  ${r.status==='awaiting_approval'?'<div class="row" style="margin-top:10px"><button id="ap">Approve &amp; continue</button><button class="ghost" id="rj">Reject</button></div>':''}</div>`;
  const dec=ok=>guard(async()=>{const x=await api(`/crew/runs/${r.id}/approve`,{method:'POST',body:{approve:ok}});S.ds=await api('/datasets/'+S.ds.id);await refreshList();drawRun(x)});
  if($('#ap')){$('#ap').onclick=()=>dec(true);$('#rj').onclick=()=>dec(false)}}

// ---------- trust
async function trustView(){const d=S.ds,rid=S.rid;$('#pane').innerHTML='<div class="card">Loading…</div>';const [p,l]=await Promise.all([api('/privacy/dashboard'),api('/ledger/verify')]);if(rid!==S.rid)return;
  $('#pane').innerHTML=`<div class="card"><h3 style="margin-top:0">Privacy dashboard</h3><div class="gauges">${gauge('bytes sent externally',p.bytes_sent_external)}${gauge('fields masked',p.fields_masked)}${gauge('ledger entries',p.ledger_entries)}</div>
  <p>Mode <b>${esc(p.mode)}</b>. Ledger hash chain: <b class="${l.ok?'':'err'}">${l.ok?'verified ('+l.entries+' entries)':'BROKEN at entry '+l.broken_at_seq}</b>. Models used: ${esc(Object.keys(p.models_used).join(', ')||'none (rule-based, local)')}</p>
  <p class="mute">We claim verifiable controls, not absolute security.</p></div>
  <div class="card"><h3 style="margin-top:0">Data Passport</h3><button id="pp">Issue passport for current state</button><div id="pr"></div></div>`;
  $('#pp').onclick=()=>guard(async()=>{const x=await api(`/datasets/${d.id}/passport`,{method:'POST'});$('#pr').innerHTML=`<p>Score ${x.score.before} → ${x.score.after} · risks found ${x.risks.found}, resolved ${x.risks.resolved}, open ${x.risks.open}</p><p><a href="/passport/${esc(x.public_id)}" target="_blank">Open public passport page</a> · <span class="mute">${esc(x.content_hash)}</span></p>`})}

// ---------- data
async function dataView(){const d=S.ds,rid=S.rid;const r=await api(`/datasets/${d.id}/rows?limit=30`);if(rid!==S.rid)return;
  $('#pane').innerHTML=`<div class="card"><div class="mute">First 30 of ${r.total} rows (current version). Row ids are stable across versions.</div><div class="scroll"><table><tr>${r.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${r.rows.map(x=>`<tr>${r.columns.map(c=>`<td>${esc(x[c])}</td>`).join('')}</tr>`).join('')}</table></div></div>
  <div class="card"><h3 style="margin-top:0">Profile</h3><div class="scroll"><table><tr><th>Column</th><th>Type</th><th>Missing</th><th>Distinct</th><th>Samples</th></tr>${Object.entries(d.profile.columns).map(([c,i])=>`<tr><td>${esc(c)}</td><td>${esc(i.semantic)}</td><td>${(i.null_rate*100).toFixed(1)}%</td><td>${i.distinct}</td><td>${esc(i.samples.slice(0,3).join(' · '))}</td></tr>`).join('')}</table></div></div>`}
boot();
</script></body></html>
