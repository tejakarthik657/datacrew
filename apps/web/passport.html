<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Passport</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--ink:#16202b;--mute:#667085;--line:#e3e7ec;--brand:#2b5fd9}@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e8edf2;--mute:#93a1b1;--line:#2a3542;--brand:#6c9bff}}
body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:760px;margin:24px auto;padding:0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}button{background:var(--brand);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;cursor:pointer}.mute{color:var(--mute)}.big{font-size:38px;font-weight:700}code{word-break:break-all;font-size:12px}</style></head>
<body><main><div class="card"><h1 style="margin-top:0">Data Passport</h1><div id="c">Loading…</div></div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const id=location.pathname.split('/').pop();const r=await fetch('/passports/'+id);if(!r.ok){document.getElementById('c').textContent='Passport not found.';return}const d=await r.json();
document.getElementById('c').innerHTML=`<p><b>${esc(d.dataset.name)}</b><br><span class="mute">collected ${esc(d.dataset.source.collected_at)} · source: ${esc(d.dataset.source.type)}/${esc(d.dataset.source.origin||'')}</span></p>
<p><span class="big">${d.score.before}</span> → <span class="big">${d.score.after}</span> <span class="mute">health score (deterministic, recomputable)</span></p>
<p>Risks: found ${d.risks.found}, resolved ${d.risks.resolved}, open ${d.risks.open} · Privacy: mode <b>${esc(d.privacy.mode)}</b>, ${d.privacy.fields_masked} fields masked, ${d.privacy.bytes_sent_external} bytes sent externally</p>
<h3>Changes (${d.changes.length})</h3><table><tr><th>Step</th><th>Type</th><th>Rows</th><th>Undo ref</th></tr>${d.changes.map(c=>`<tr><td>${esc(c.step_id)}</td><td>${esc(c.type)}</td><td>${c.rows}</td><td>${esc(c.undo_ref)}</td></tr>`).join('')}</table>
<p class="mute">Lineage: ${esc(d.lineage.versions.join(' → '))}<br>Recipe hash: <code>${esc(d.lineage.recipe_hash)}</code></p><p>Content hash: <code>${esc(d.content_hash)}</code></p>
<button id="v">Verify hash</button> <span id="vr"></span>`;
document.getElementById('v').onclick=async()=>{const x=await (await fetch('/passports/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})).json();
document.getElementById('vr').innerHTML=x.verified?'<b style="color:#2f855a">✔ verified: hash matches and score recomputes</b>':'<b style="color:#c0392b">✘ verification failed</b>'}})();
</script></body></html>
